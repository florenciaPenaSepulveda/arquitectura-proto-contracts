syntax = "proto3";
package vehiculo;

message ProtoVehiculo {
    string vehiculoId = 1;
    string ownerId = 2;
    string marca = 3;
    string modelo = 4;
    string patente = 5;
}

message CrearVehiculo{
    string ownerId = 1;
    string marca = 2;
    string modelo = 3;
    string patente = 4;
}

message ProtoVehiculoList{
    repeated ProtoVehiculo vehiculos = 1;
}

message VehiculosPorClienteRequest{
    string ownerId = 1;
}

message VehiculosPorClienteDataResponse{
    string ownerId = 1;
    string nombreCliente = 2;
    repeated ProtoVehiculo vehiculos = 3;
}

service ProtoVehiculoService{
    rpc FindAll (Empty) returns (ProtoVehiculoList);
    rpc CrearVehiculo (CrearVehiculo) returns (ProtoVehiculo);
    rpc BuscarVehiculosPorIdCliente (VehiculosPorClienteRequest) returns(VehiculosPorClienteDataResponse);
}

message Empty{}
syntax = "proto3";
package usuario;

message ProtoUsuario {
    string userId = 1;
    string username = 2;
    string role = 3;
}

message CrearUsuario {
    string username = 1;
    string password = 2;
    string role = 3;
}

message FindUserByIdRequest{
    string userId = 1;
}

message ProtoUsuarioList {
    repeated ProtoUsuario usuarios = 1;
}

service ProtoUsuarioService {
    rpc FindAll (Empty) returns(ProtoUsuarioList);
    rpc CrearCuenta (CrearUsuario) returns(ProtoUsuario);
    rpc FindUserById (FindUserByIdRequest) returns(ProtoUsuario);
}

message Empty {}